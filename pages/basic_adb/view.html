<body>
    <h1>Basic ADB</h1>
    <h2>Wireless Debug</h2>
<pre><code>adb pair {ip}:{port}
</code></pre>
<p>Don't confuse the pair ip and port with the connection ip and port.</p>
<pre><code>adb connect {ip}:{port}
</code></pre>
<h2>Install apk</h2>
<pre><code>adb install {file.apk}
</code></pre>
<p>Easy outside shell.</p>
