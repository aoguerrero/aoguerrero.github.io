    <h1>udisksctl</h1>
    <p>This utility helps to mount disk drives without root.</p>
<pre><code>udisksctl mount -b /dev/sda{n}

# To identify by UUID

udisksctl mount -b /dev/disk/by-uuid/{UUID}

</code></pre>
<p>You can set a predefined UUID to a drive using <a href="../tune2fs/view.html">tune2fs</a></p>
