    <h1>Possible fix for kernel update error (Debian)</h1>
    <p>List modules</p>
<pre><code>sudo dkms status
</code></pre>
<p>Remove all (use the first part of the result, including the complete version)</p>
<pre><code>sudo dkms remove {} --all
</code></pre>
<p>Update, Upgrade</p>
<pre><code>sudo apt-get update
sudo apt-get upgrade
</code></pre>
