<body>
    <h1>nano</h1>
    <p>~/.nanorc</p>
<pre><code>set softwrap
set linenumbers
set indicator
set tabsize 2
set tabstospaces
</code></pre>
<p>~/.bashrc</p>
<pre><code>alias na=&quot;nano -Ynone --modernbindings --zero&quot;
</code></pre>
<p>Modern Key Bindings are...</p>
<p><code>CTRL+Q</code> Quit<br />
<code>CTRL+S</code> Save<br />
<code>CTRL+F</code> Search<br />
<code>CTRL+Z</code> Undo<br />
<code>CTRL+Y</code> Redo<br />
<code>CTRL+C</code> Copy<br />
<code>CTRL+X</code> Cut<br />
<code>CTRL+P</code> Paste</p>
